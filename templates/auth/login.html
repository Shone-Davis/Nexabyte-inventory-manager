{% extends "base.html" %}
{% block title %}Login - NEXABYTE{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-2xl front-semibold text-gray-900">Sign in</h1>
            <p class="text-gray-500 text-sm mt-1">NEXABYTE Inventory Manager</p>
        </div>
        {% if error %}
        <div class="bg-red-50 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm mb-4">
            {{error}}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Username
                </label>
                <input type="text" name="username" required autofocus class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50
                           focus:outline-none focus:ring-2 focus:ring-gray-900 focus:bg-white
                           text-sm transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Password
                </label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50
                           focus:outline-none focus:ring-2 focus:ring-gray-900 focus:bg-white
                           text-sm transition-all">
            </div>

            <button type="submit" class="w-full bg-gray-900 text-white py-3 rounded-xl text-sm font-medium 
            hover:bg-gray-700 transition-colors mt-2">
                Sign in
            </button>
        </form>
    </div>
</div>
{% endblock %}
