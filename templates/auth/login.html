{% extends "base.html" %}
{% block title %}Login - NEXABYTE{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-sm">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold text-white">Sign in</h1>
            <p class="text-white/40 text-sm mt-1">NEXABYTE Inventory Manager</p>
        </div>
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 text-red-400
                    px-4 py-3 rounded-xl text-sm mb-4">
            {{error}}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-white/60 mb-1">
                    Username
                </label>
                <input type="text" name="username" required autofocus class="w-full px-4 py-3 rounded-xl border border-white/10
                           bg-white/5 text-white text-sm placeholder-white/30
                           focus:outline-none focus:ring-2 focus:ring-white/20
                           transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-white/60 mb-1">
                    Password
                </label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-white/10
                           bg-white/5 text-white text-sm placeholder-white/30
                           focus:outline-none focus:ring-2 focus:ring-white/20
                           transition-all">
            </div>

            <button type="submit" class="w-full bg-white text-black py-3 rounded-xl text-sm
                       font-medium hover:bg-white/90 transition-colors mt-2">
                Sign in
            </button>
        </form>
    </div>
</div>
{% endblock %}
