{% extends "base.html"%}
{% block title %}403 - Access Denied{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center">
    <h1 class="text-8xl font-bold text-white/10">403</h1>
    <h2 class="text-2xl font-semibold text-white mt-4">Access Denied</h2>
    <p class="text-white/40 mt-2">You don't have permission to access this page.</p>
    <a href="{{url_for('dashboard.index')}}"
        class="mt-8 bg-white text-black px-6 py-3 rounded-full text-sm hover:bg-white/90 transition-colors">
        Go to Dashboard
    </a>
</div>
{% endblock %}
