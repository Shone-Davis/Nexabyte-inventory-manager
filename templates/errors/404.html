{% extends "base.html" %}
{% block title %}404 - NOT FOUND{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center">
    <h1 class="text-8xl font-bold text-gray-100">404</h1>
    <h2 class="text-2xl font-semibold text-gray-900 mt-4">Page Not Found</h2>
    <p class="text-gray-500 mt-2">The the page you're looking for doesn't exist.</p>
    <a href="{{ url_for('dashboard.index') }}"
        class="mt-8 bg-gray-900 text-white px-6 py-3 rounded-full text-sm hover:bg-gray-700 transition-colors">
        Go Home</a>
</div>
{% endblock %}
