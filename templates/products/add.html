{% extends "base.html" %}
{% block title %}Add Product — NEXABYTE{% endblock %}

{% block content %}

<!-- Header -->
<div class="mb-8 flex items-center justify-between">
    <div>
        <h1 class="text-3xl font-semibold text-white">Add Product</h1>
        <p class="text-white/40 text-sm mt-1">Add a new item to your inventory</p>
    </div>
    <a href="{{ url_for('products.index') }}" class="text-white/40 hover:text-white text-sm transition-colors
          mb-8 inline-flex items-center gap-2 group">
        <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back to Products
    </a>
</div>

<!-- Form Card -->
<div class="max-w-2xl bg-white/5 border border-white/10 rounded-2xl p-8">
    <form method="POST" class="space-y-6">

        <!-- Name -->
        <div>
            <label class="block text-sm font-medium text-white/60 mb-1">
                Product Name
            </label>
            <input type="text" name="name" required placeholder="e.g. iPhone 17 Pro" class="w-full px-4 py-3 rounded-xl border border-white/10
                          bg-white/5 text-white placeholder-white/30 text-sm focus:outline-none focus:ring-2
                          focus:ring-white/20 focus:bg-white/8 transition-all">
        </div>

        <!-- Price + Category side by side -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-white/60 mb-1">
                    Price ($)
                </label>
                <input type="number" name="price" step="0.01" required placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-white/10
                              bg-white/5 text-white placeholder-white/30 text-sm focus:outline-none focus:ring-2
                              focus:ring-white/20 focus:bg-white/8 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-white/60 mb-1">
                    Category
                </label>
                <select name="category" required class="w-full px-4 py-3 rounded-xl border border-white/10
                               bg-white/5 text-white text-sm focus:outline-none focus:ring-2
                               focus:ring-white/20 focus:bg-white/8 transition-all">
                    <option value="" disabled selected>Select category</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Description -->
        <div>
            <label class="block text-sm font-medium text-white/60 mb-1">
                Description
            </label>
            <textarea name="description" rows="3" placeholder="Describe the product..." class="w-full px-4 py-3 rounded-xl border border-white/10
                             bg-white/5 text-white placeholder-white/30 text-sm focus:outline-none focus:ring-2
                             focus:ring-white/20 focus:bg-white/8 transition-all
                             resize-none"></textarea>
        </div>

        <!-- Stock + Threshold side by side -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-white/60 mb-1">
                    Stock Quantity
                </label>
                <input type="number" name="stock" value="0" min="0" class="w-full px-4 py-3 rounded-xl border border-white/10
                              bg-white/5 text-white placeholder-white/30 text-sm focus:outline-none focus:ring-2
                              focus:ring-white/20 focus:bg-white/8 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-white/60 mb-1">
                    Low Stock Alert At
                </label>
                <input type="number" name="low_stock_threshold" value="10" min="1" class="w-full px-4 py-3 rounded-xl border border-white/10
                              bg-white/5 text-white placeholder-white/30 text-sm focus:outline-none focus:ring-2
                              focus:ring-white/20 focus:bg-white/8 transition-all">
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex items-center justify-between pt-4 border-t border-white/10">
            <a href="{{ url_for('products.index') }}" class="text-sm text-white/40 hover:text-white transition-colors">
                Cancel
            </a>
            <button type="submit" class="bg-white text-black px-8 py-3 rounded-full text-sm
                           font-medium hover:bg-white/90 transition-colors">
                Add Product
            </button>
        </div>

    </form>
</div>

{% endblock %}
