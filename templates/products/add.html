{% extends "base.html" %}
{% block title %}Add Product — NEXABYTE{% endblock %}

{% block content %}

<!-- Header -->
<div class="mb-8 flex items-center justify-between">
    <div>
        <h1 class="text-3xl font-semibold text-gray-900">Add Product</h1>
        <p class="text-gray-500 text-sm mt-1">Add a new item to your inventory</p>
    </div>
    <a href="{{ url_for('products.index') }}" class="text-sm text-gray-500 hover:text-gray-900 transition-colors">
        ← Back to Products
    </a>
</div>

<!-- Form Card -->
<div class="max-w-2xl bg-white border border-gray-100 rounded-2xl p-8 shadow-sm">
    <form method="POST" class="space-y-6">

        <!-- Name -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Product Name
            </label>
            <input type="text" name="name" required placeholder="e.g. iPhone 17 Pro" class="w-full px-4 py-3 rounded-xl border border-gray-200
                          bg-gray-50 text-sm focus:outline-none focus:ring-2
                          focus:ring-gray-900 focus:bg-white transition-all">
        </div>

        <!-- Price + Category side by side -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Price ($)
                </label>
                <input type="number" name="price" step="0.01" required placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-gray-200
                              bg-gray-50 text-sm focus:outline-none focus:ring-2
                              focus:ring-gray-900 focus:bg-white transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Category
                </label>
                <select name="category" required class="w-full px-4 py-3 rounded-xl border border-gray-200
                               bg-gray-50 text-sm focus:outline-none focus:ring-2
                               focus:ring-gray-900 focus:bg-white transition-all">
                    <option value="" disabled selected>Select category</option>
                    <option value="Laptops">Laptops</option>
                    <option value="Phones">Phones</option>
                    <option value="Audio">Audio</option>
                    <option value="Tablets">Tablets</option>
                    <option value="Accessories">Accessories</option>
                </select>
            </div>
        </div>

        <!-- Description -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Description
            </label>
            <textarea name="description" rows="3" placeholder="Describe the product..." class="w-full px-4 py-3 rounded-xl border border-gray-200
                             bg-gray-50 text-sm focus:outline-none focus:ring-2
                             focus:ring-gray-900 focus:bg-white transition-all
                             resize-none"></textarea>
        </div>

        <!-- Stock + Threshold side by side -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Stock Quantity
                </label>
                <input type="number" name="stock" value="0" min="0" class="w-full px-4 py-3 rounded-xl border border-gray-200
                              bg-gray-50 text-sm focus:outline-none focus:ring-2
                              focus:ring-gray-900 focus:bg-white transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Low Stock Alert At
                </label>
                <input type="number" name="low_stock_threshold" value="10" min="1" class="w-full px-4 py-3 rounded-xl border border-gray-200
                              bg-gray-50 text-sm focus:outline-none focus:ring-2
                              focus:ring-gray-900 focus:bg-white transition-all">
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex items-center justify-between pt-4 border-t border-gray-100">
            <a href="{{ url_for('products.index') }}"
                class="text-sm text-gray-500 hover:text-gray-900 transition-colors">
                Cancel
            </a>
            <button type="submit" class="bg-gray-900 text-white px-8 py-3 rounded-full text-sm
                           font-medium hover:bg-gray-700 transition-colors">
                Add Product
            </button>
        </div>

    </form>
</div>

{% endblock %}
